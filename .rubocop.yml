# Omakase Ruby styling for Rails
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

plugins:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - 'bin/**/*'
    - 'db/schema.rb'
    - 'db/migrate/**/*'
    - 'node_modules/**/*'
    - 'vendor/**/*'
    - 'client/**/*'
    - 'tmp/**/*'

# Style
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

# Layout
Layout/LineLength:
  Max: 120
  AllowedPatterns: ['^\s*#']

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

# Metrics
Metrics/MethodLength:
  Max: 20
  CountAsOne: ['array', 'hash', 'heredoc']

Metrics/ClassLength:
  Max: 200
  CountAsOne: ['array', 'hash', 'heredoc']

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'config/routes.rb'
    - 'config/environments/**/*'

Metrics/AbcSize:
  Max: 25

# Rails
Rails/SkipsModelValidations:
  Enabled: false

Rails/HasManyOrHasOneDependent:
  Enabled: false

# RSpec
#
# The request specs describe whole API round-trips: build the params, post,
# then assert on status *and* the response body. That legitimately runs a
# little past the defaults, and splitting one round-trip across several
# examples to satisfy a counter makes the specs harder to read, not easier.
RSpec/ExampleLength:
  Max: 25

RSpec/MultipleExpectations:
  Max: 6

RSpec/MultipleMemoizedHelpers:
  Max: 6

RSpec/NestedGroups:
  Max: 4

# Authentication is cookie/session based and the only programmatic login route
# (auth/token-login) is gated behind TOKEN_LOGIN_SECRET and mints its own admin
# user, so request specs cannot sign in as the user they set up. Stubbing
# ApplicationController is the seam that is actually available. Worth revisiting
# if a test-friendly login helper lands.
RSpec/AnyInstance:
  Enabled: false
